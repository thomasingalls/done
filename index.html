<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` plus `interactive-widget=resizes-content` so the soft
      keyboard shrinks the layout viewport instead of scrolling the page out
      from under itself — the document never scrolls (TRD §8.2).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfcfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161a" />
    <meta name="description" content="A local-first place to write down what you are doing." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>done</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
