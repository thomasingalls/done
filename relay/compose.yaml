# One process and a volume.
#
# TLS is not this container's job — put it behind something with a certificate
# (see README.md). Bound to localhost here so that an accidental `up` on a box
# with a public interface is not a public relay.

services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      # Required. `openssl rand -base64 32` is a fine way to make one.
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN in .env}
      # Optional: the rooms this relay serves. One person, one document, one room.
      RELAY_ROOMS: ${RELAY_ROOMS:-done}
    ports:
      - '127.0.0.1:1234:1234'
    volumes:
      - relay-state:/data

volumes:
  relay-state:
