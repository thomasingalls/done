name: CI

on:
  workflow_dispatch:
    inputs:
      run_full_check:
        description: Run the full check after explicitly resuming the paused validation campaign
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

# Project code and dependencies run in this workflow. Keep its token read-only
# and do not add secrets: install-time scripts are disabled, but build and test
# dependencies still execute code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and regression gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies

      - name: Build and check the application
        run: pnpm build

      - name: Check security contracts and published vectors
        run: pnpm vectors:check && pnpm retention:check && pnpm status:check && pnpm limit:check && pnpm authority:check && pnpm recipient:check && pnpm admission:check && pnpm remediation:check && pnpm debts:check && pnpm wasm:verify

      - name: Check the complete release inventory
        run: pnpm validation:inventory && node scripts/release-validation/plan.mjs

      - name: Check release execution adapters
        run: node --test --test-concurrency=2 test/release-validation/onboarding-gates.test.mjs test/release-validation/vitest.test.mjs test/release-validation/playwright.test.mjs test/release-validation/general-tests.test.mjs test/release-validation/generated-tests.test.mjs test/release-validation/account-fixtures.test.mjs test/release-validation/campaign-wrappers.test.mjs test/release-validation/manifest.test.mjs test/account-first-authority/registry.test.mjs

      - name: Run all unit regression tests
        # Keep each case's workload and deadline; avoid two heavy files competing on this runner.
        run: pnpm test --maxWorkers=1

      - name: Check packaged application routing and gateway boundaries
        run: node --test --test-concurrency=1 --test-timeout=15000 test/account-application/*.test.mjs

      - name: Check authenticated enrollment read batching and existing transport boundaries
        run: node --test --test-concurrency=1 --test-timeout=30000 test/account-sessions/inbound-batch.test.mjs test/account-sessions/scoped-http.test.mjs test/account-history/source.test.mjs test/account-membership/handoff.test.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check development compiler loading with fresh and retained caches
        run: pnpm exec playwright test --config playwright.compiler-loading.config.ts

      - name: Check source artifacts and historical owner regressions
        run: >-
          node --test --test-concurrency=1 --test-timeout=60000
          test/account-successor/emitted-bundle.test.mjs
          test/account-successor/stage-authentication.test.mjs
          test/account-admission-bounds/historical-closure.test.mjs
          test/account-receive/historical-owner.test.mjs

      - name: Check service quarantine and restart histories
        run: node --test --test-concurrency=1 test/account-service-inbound/generated.test.mjs test/account-service-inbound/quarantine.test.mjs

      - name: Check upgrade fixture listener ownership
        run: node --test --test-concurrency=1 test/harness-lifecycle/upgrade-fixture.test.mjs

      - name: Check Local bootstrap and native compatibility refusals
        run: pnpm storage:compatibility

      - name: Run onboarding, account compatibility and device-removal browser regressions
        run: >-
          pnpm exec playwright test --config playwright.packaged-account.config.ts
          test/packaged-account/removal-regressions.spec.ts
          test/packaged-account/local-removal-flow.spec.ts
          test/packaged-account/account-creation-entry.spec.ts
          test/packaged-account/empty-legacy-startup.spec.ts
          test/packaged-account/enrollment-batch.spec.ts
          test/packaged-account/enrollment-progress.spec.ts
          test/packaged-account/welcome.spec.ts
          test/packaged-account/passkey-local-access.spec.ts
          test/packaged-account/multi-tab-protection.spec.ts
          test/packaged-account/recovery-progress-isolation.spec.ts
          test/packaged-account/receiver-compatibility.spec.ts
          test/packaged-account/bootstrap-compatibility.spec.ts

      - name: Check development onboarding and service shutdown
        run: pnpm test:account-setup

      - name: Check security evidence traceability
        run: pnpm trace:check

  quality:
    name: Full check (operator resumed)
    # The product/operations work does not automatically resume release validation.
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_check == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate reads history, not just the tree: remediation:check proves
          # every record's "speaks of" SHA is an ancestor of HEAD, and
          # trace:check holds evidence recency against the reviewed tip. A
          # shallow clone fails all 21 records at once, ancestry unseen.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run the quality gate
        run: pnpm check
