name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Project code and dependencies run in this workflow. Keep its token read-only
# and do not add secrets: install-time scripts are disabled, but build and test
# dependencies still execute code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run the quality gate
        run: pnpm check
