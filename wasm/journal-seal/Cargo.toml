# The synchronous journal seal, compiled from a reviewed implementation.
#
# Why this crate exists (TRD §12, §15 row 2). The journal write exceeds its 1 ms
# budget at 4 kB on a Pixel 9a — 1 930 µs p95 — and the cause is measured: pure-JS
# 32-bit arithmetic, not one library's code shape. Two independent pure-JS
# implementations land within 1% of each other, so swapping the import is not a
# fix. libsodium in WASM is 24× faster and 3.4× too large to ship. This is the
# third option priced: the audited RustCrypto crate, compiled to a module small
# enough to inline.
#
# No wasm-bindgen. Its glue is JS the bundle has to carry and an async init the
# journal cannot await, and none of what it buys — rich types across the
# boundary — is wanted by a function that takes four byte slices.

[package]
name = "journal-seal"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# default-features = false drops `alloc`, `getrandom` and `std`. The nonce is
# generated by the caller (row 2: 24 random bytes per record, from the platform
# CSPRNG), so this module needs no randomness of its own.
chacha20poly1305 = { version = "0.10", default-features = false }

# opt-level 3 rather than "z", and the sweep is the reason (docs/performance.md).
# Size barely responds to this setting — 5.2 kB at "z" against 6.9 kB at 3 — while
# speed responds by 2×: 20.7 µs at "z" against 11.7 µs at 3 for a 4 kB seal. The
# module is 3.1 kB gzipped through the bundler either way, against 43.7 kB of
# headroom, so optimising it for size was spending the wrong currency.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
